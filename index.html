<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f5e9c" />
    <title>ILYZGO AIR – Fly Like the Wind</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #8fd3ff;
        font-family: system-ui, sans-serif;
        /* Sur téléphone : pas de zoom, pas de défilement, pas de sélection de texte */
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; touch-action: none; }
      [hidden] { display: none !important; }

      /* Pendant le menu, on cache tout ce qui sert à jouer */
      body.menu-ouvert #hud, body.menu-ouvert #message, body.menu-ouvert #aide,
      body.menu-ouvert #tactile, body.menu-ouvert #bouton-action { display: none !important; }

      /* ---------- Tableau de bord et messages ---------- */
      #hud {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: calc(12px + env(safe-area-inset-left));
        color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6);
        font-size: 16px; line-height: 1.6; pointer-events: none;
      }
      #message {
        position: fixed; top: 22%; left: 50%; transform: translateX(-50%);
        max-width: 80%; padding: 12px 22px; border-radius: 12px; box-sizing: border-box;
        background: rgba(0,0,0,.5); color: #fff; font-size: 22px; text-align: center;
        opacity: 0; transition: opacity .4s; pointer-events: none;
      }
      #message.visible { opacity: 1; }
      #aide {
        position: fixed; bottom: 10px; left: 0; right: 0; text-align: center;
        color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 14px; pointer-events: none;
      }
      body.mode-pieton .aide-avion, body.mode-avion .aide-pieton { display: none; }

      /* ---------- Le bouton MONTER / DESCENDRE (téléphone ET ordinateur) ---------- */
      #bouton-action {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: calc(44px + env(safe-area-inset-bottom));
        padding: 12px 24px; border-radius: 99px; border: 3px solid #fff;
        background: #ffbe0b; color: #16324f; font: 800 17px system-ui, sans-serif;
        box-shadow: 0 4px 14px rgba(0,0,0,.3); cursor: pointer; white-space: nowrap;
        animation: pulser 1.2s ease-in-out infinite; touch-action: none;
      }
      @keyframes pulser { 50% { transform: translateX(-50%) scale(1.07); } }

      /* ---------- Commandes tactiles (cachées sur ordinateur) ---------- */
      #tactile, #plein-ecran { display: none; }
      body.tactile #tactile, body.tactile #plein-ecran { display: block; }
      body.tactile #aide { display: none; }
      body.tactile #bouton-action { bottom: calc(22px + env(safe-area-inset-bottom)); }
      /* À pied : pas de manette des gaz ni de frein. En avion : pas de bouton saut. */
      body.mode-pieton #manette, body.mode-pieton #bouton-frein { display: none; }
      body:not(.mode-pieton) #bouton-saut { display: none; }

      .commande {
        position: fixed; touch-action: none;
        background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.55);
        box-shadow: 0 2px 8px rgba(0,0,0,.15);
      }
      .etiquette {
        position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
        color: #fff; font-size: 12px; font-weight: bold; white-space: nowrap;
        text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none;
      }

      /* Le manche (joystick) à gauche */
      #manche {
        left: calc(18px + env(safe-area-inset-left));
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 130px; height: 130px; border-radius: 50%;
      }
      #manche-bouton {
        position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: rgba(255,255,255,.7); pointer-events: none;
      }
      .fleche {
        position: absolute; left: 50%; transform: translateX(-50%);
        color: rgba(255,255,255,.85); font-size: 11px; pointer-events: none; white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0,0,0,.6);
      }

      /* La manette des gaz à droite */
      #manette {
        right: calc(18px + env(safe-area-inset-right));
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 58px; height: 170px; border-radius: 29px;
      }
      #manette-remplissage {
        position: absolute; left: 0; right: 0; bottom: 0; height: 0;
        border-radius: 27px; background: rgba(230,57,70,.45); pointer-events: none;
      }
      #manette-poignee {
        position: absolute; left: 4px; right: 4px; height: 22px; bottom: 0;
        border-radius: 11px; background: rgba(255,255,255,.85); pointer-events: none;
      }

      /* Les boutons ronds : FREIN (en avion) et SAUT (à pied) */
      .rond {
        width: 74px; height: 74px; border-radius: 50%; padding: 0;
        color: #fff; font: bold 13px system-ui, sans-serif; background: rgba(0,0,0,.25);
        bottom: calc(18px + env(safe-area-inset-bottom));
      }
      #bouton-frein { right: calc(18px + 58px + 16px + env(safe-area-inset-right)); }
      #bouton-frein.actif { background: rgba(230,57,70,.75); }
      #bouton-saut { right: calc(18px + env(safe-area-inset-right)); width: 84px; height: 84px; }

      /* Le bouton plein écran */
      #plein-ecran {
        position: fixed; z-index: 60;
        top: calc(10px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        width: 40px; height: 40px; border-radius: 10px; padding: 0;
        border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.25);
        color: #fff; font-size: 20px;
      }

      /* ---------- Petits écrans (téléphones) : rien ne doit se chevaucher ---------- */
      @media (max-width: 700px), (max-height: 500px) {
        #hud { font-size: 12px; line-height: 1.35; max-width: 46vw; }
        #manche { width: 110px; height: 110px; }
        #manche-bouton { width: 46px; height: 46px; }
        #manette { height: 140px; width: 52px; }
        .rond { width: 62px; height: 62px; font-size: 12px; }
        #bouton-frein { right: calc(18px + 52px + 14px + env(safe-area-inset-right)); }
        #bouton-saut { width: 70px; height: 70px; }
        #bouton-action { font-size: 15px; padding: 9px 18px; }
      }
      /* Téléphone à l'horizontale : le message se place en haut, entre le tableau de bord et le bouton plein écran */
      @media (max-height: 500px) {
        #message {
          top: calc(8px + env(safe-area-inset-top)); left: 48vw; right: 64px; transform: none;
          max-width: none; font-size: 14px; padding: 8px 12px;
        }
      }
      /* Téléphone en hauteur : le message passe sous le tableau de bord, le bouton au-dessus des commandes */
      @media (max-width: 700px) and (min-height: 501px) {
        #message { top: 165px; max-width: 92%; width: max-content; font-size: 15px; padding: 8px 14px; }
        body.tactile #bouton-action { bottom: calc(150px + env(safe-area-inset-bottom)); }
      }
    </style>
  </head>
  <body class="menu-ouvert">
    <div id="hud"></div>
    <div id="message"></div>
    <div id="aide">
      <span class="aide-pieton">↑ ↓ ← → (ou Z Q S D) marcher · Shift courir · Espace sauter · E monter dans l'avion</span>
      <span class="aide-avion">↑ ↓ piquer / cabrer · ← → pencher · Gaz : 0 à 9 (ou Espace / Shift) · F freins / volets · E descendre</span>
    </div>

    <!-- Le bouton pour monter dans l'avion / en descendre -->
    <button id="bouton-action" hidden></button>

    <!-- Les commandes pour téléphone et tablette -->
    <div id="tactile">
      <div id="manche" class="commande">
        <span class="etiquette" id="etiquette-manche">Manche</span>
        <span class="fleche" id="fleche-haut" style="top:4px">▲ piquer</span>
        <span class="fleche" id="fleche-bas" style="bottom:4px">▼ monter</span>
        <div id="manche-bouton"></div>
      </div>
      <button id="bouton-frein" class="commande rond">FREIN</button>
      <button id="bouton-saut" class="commande rond">SAUT</button>
      <div id="manette" class="commande">
        <span class="etiquette" id="manette-texte">Gaz 0%</span>
        <div id="manette-remplissage"></div>
        <div id="manette-poignee"></div>
      </div>
    </div>
    <button id="plein-ecran" aria-label="Plein écran">⛶</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

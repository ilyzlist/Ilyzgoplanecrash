<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#8fd3ff" />
    <title>ILYZGO AIR – Fly Like the Wind</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #8fd3ff;
        font-family: system-ui, sans-serif;
        /* Sur téléphone : pas de zoom, pas de défilement, pas de sélection de texte */
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; touch-action: none; }

      /* ---------- Tableau de bord ---------- */
      #hud {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: calc(12px + env(safe-area-inset-left));
        color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6);
        font-size: 16px; line-height: 1.6; pointer-events: none;
      }
      #message {
        position: fixed; top: 22%; left: 50%; transform: translateX(-50%);
        max-width: 80%; padding: 12px 22px; border-radius: 12px;
        background: rgba(0,0,0,.45); color: #fff; font-size: 22px; text-align: center;
        opacity: 0; transition: opacity .4s; pointer-events: none;
      }
      #message.visible { opacity: 1; }
      #aide {
        position: fixed; bottom: 10px; left: 0; right: 0; text-align: center;
        color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 14px; pointer-events: none;
      }

      /* ---------- Commandes tactiles (cachées sur ordinateur) ---------- */
      #tactile, #plein-ecran { display: none; }
      body.tactile #tactile, body.tactile #plein-ecran { display: block; }
      body.tactile #aide { display: none; }

      .commande {
        position: fixed; touch-action: none;
        background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.55);
        box-shadow: 0 2px 8px rgba(0,0,0,.15);
      }
      .etiquette {
        position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
        color: #fff; font-size: 12px; font-weight: bold; white-space: nowrap;
        text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none;
      }

      /* Le manche (joystick) à gauche */
      #manche {
        left: calc(18px + env(safe-area-inset-left));
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 130px; height: 130px; border-radius: 50%;
      }
      #manche-bouton {
        position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: rgba(255,255,255,.7); pointer-events: none;
      }
      .fleche {
        position: absolute; color: rgba(255,255,255,.8); font-size: 13px; pointer-events: none;
        text-shadow: 0 1px 2px rgba(0,0,0,.6);
      }

      /* La manette des gaz à droite */
      #manette {
        right: calc(18px + env(safe-area-inset-right));
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 58px; height: 170px; border-radius: 29px; overflow: visible;
      }
      #manette-remplissage {
        position: absolute; left: 0; right: 0; bottom: 0; height: 0;
        border-radius: 27px; background: rgba(230,57,70,.45); pointer-events: none;
      }
      #manette-poignee {
        position: absolute; left: 4px; right: 4px; height: 22px; bottom: 0;
        border-radius: 11px; background: rgba(255,255,255,.85); pointer-events: none;
      }

      /* Le bouton frein */
      #bouton-frein {
        right: calc(18px + 58px + 16px + env(safe-area-inset-right));
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 74px; height: 74px; border-radius: 50%;
        color: #fff; font: bold 13px system-ui, sans-serif; padding: 0;
        background: rgba(0,0,0,.25);
      }
      #bouton-frein.actif { background: rgba(230,57,70,.75); }

      /* Le bouton plein écran */
      #plein-ecran {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        width: 40px; height: 40px; border-radius: 10px; padding: 0;
        border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.25);
        color: #fff; font-size: 20px;
      }

      /* Petits écrans (téléphones) : tout est plus petit pour bien voir le jeu */
      @media (max-width: 700px), (max-height: 500px) {
        #hud { font-size: 12px; line-height: 1.35; }
        #message { font-size: 15px; padding: 8px 14px; top: 14%; max-width: 70%; }
        #manche { width: 110px; height: 110px; }
        #manche-bouton { width: 46px; height: 46px; }
        #manette { height: 140px; width: 52px; }
        #bouton-frein { width: 62px; height: 62px; right: calc(18px + 52px + 14px + env(safe-area-inset-right)); }
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="message"></div>
    <div id="aide">
      ↑ ↓ piquer / cabrer · ← → pencher pour tourner · Gaz : touches 0 à 9 (ou Espace / Shift) ·
      F : freins au sol, volets en vol · Pour décoller : gaz 9, puis ↓
    </div>

    <!-- Les commandes pour téléphone et tablette -->
    <div id="tactile">
      <div id="manche" class="commande">
        <span class="etiquette">Manche</span>
        <span class="fleche" style="top:4px;left:50%;transform:translateX(-50%)">▲ piquer</span>
        <span class="fleche" style="bottom:4px;left:50%;transform:translateX(-50%)">▼ monter</span>
        <div id="manche-bouton"></div>
      </div>
      <button id="bouton-frein" class="commande">FREIN</button>
      <div id="manette" class="commande">
        <span class="etiquette" id="manette-texte">Gaz 0%</span>
        <div id="manette-remplissage"></div>
        <div id="manette-poignee"></div>
      </div>
    </div>
    <button id="plein-ecran" aria-label="Plein écran">⛶</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
